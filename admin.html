<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
    body { background: #eef2f7; padding: 15px; display: flex; justify-content: center; }
    
    .login-box { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; margin-top: 50px; }
    .login-box h2 { color: #1e3a8a; margin-bottom: 20px; }
    .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; outline: none; }
    .login-box button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
    .error { color: #dc2626; font-size: 14px; margin-top: 10px; display: none; }

    #mainPanel { display: none; width: 100%; max-width: 900px; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; background: #e2e8f0; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; color: #475569; transition: 0.3s; }
    .tab-btn.active { background: #2563eb; color: #fff; }

    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: none; }
    .card.active { display: block; }
    
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    @media (min-width: 600px) { .form-grid { grid-template-columns: 1fr 1fr; } }
    
    .form-group { display: flex; flex-direction: column; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #4b5563; }
    input[type="text"] { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; width: 100%; }
    
    .file-upload { border: 2px dashed #cbd5e1; padding: 15px; text-align: center; border-radius: 8px; cursor: pointer; background: #f8fafc; }
    .file-upload input[type="file"] { display: none; }
    .file-upload span { font-size: 14px; color: #475569; }
    #imagePreview { max-width: 100px; max-height: 120px; margin-top: 10px; border-radius: 6px; display: none; }

    .btn-submit { grid-column: 1 / -1; padding: 12px; background: #10b981; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-cancel { display: none; grid-column: 1 / -1; padding: 10px; background: #ef4444; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 5px; text-align: center; }
    
    /* استایل کادر نتیجه و دکمه‌های کپی/باز کردن */
    .result-box { display: none; margin-top: 15px; padding: 20px; background: #ecfdf5; border: 1px solid #10b981; border-radius: 8px; text-align: center; }
    .result-box h3 { color: #065f46; margin-bottom: 15px; }
    .link-container { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .link-text { background: #fff; padding: 10px; border-radius: 6px; font-size: 13px; direction: ltr; border: 1px solid #d1d5db; width: 100%; word-break: break-all; font-family: monospace; }
    .action-buttons { display: flex; gap: 10px; width: 100%; justify-content: center; }
    .btn-action-link { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; text-decoration: none; text-align: center; display: inline-block; }
    .btn-copy { background: #3b82f6; color: white; }
    .btn-open { background: #f59e0b; color: white; }

    .table-responsive { overflow-x: auto; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; text-align: center; min-width: 600px; }
    th, td { padding: 10px; border: 1px solid #e2e8f0; }
    th { background: #f8fafc; color: #1e3a8a; }
    
    .btn-action { padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; color: #fff; border: none; margin: 0 2px; }
    .btn-delete { background: #ef4444; }
    .btn-edit { background: #f59e0b; }
  </style>
</head>
<body>

  <div id="loginBox" class="login-box">
    <h2>ورود به پنل مدیریت</h2>
    <input type="password" id="adminPassword" placeholder="رمز عبور را وارد کنید" />
    <button onclick="login()" id="loginBtn">ورود</button>
    <div id="loginError" class="error">رمز عبور اشتباه است!</div>
  </div>

  <div id="mainPanel">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('add')" id="tabBtnAdd">➕ ثبت متقاضی جدید</button>
      <button class="tab-btn" onclick="switchTab('list')">📋 مدیریت متقاضیان</button>
    </div>

    <div id="tab-add" class="card active">
      <h3 id="formTitle" style="margin-bottom: 15px; color: #1e3a8a;">ثبت متقاضی جدید</h3>
      <form id="adminForm" class="form-grid">
        <input type="hidden" id="edit_id" value="">
        
        <div class="form-group full"><label>نام و نام خانوادگی</label><input type="text" id="full_name" required></div>
        <div class="form-group"><label>نام پدر</label><input type="text" id="father_name" required></div>
        <div class="form-group"><label>کد ملی</label><input type="text" id="national_id" required></div>
        <div class="form-group"><label>سال تولد</label><input type="text" id="birth_year" required></div>
        <div class="form-group"><label>مقطع تحصیلی</label><input type="text" id="degree" value="دوره متوسطه (دیپلم)" required></div>
        <div class="form-group"><label>رشته تحصیلی</label><input type="text" id="major" required></div>
        <div class="form-group"><label>معدل کل</label><input type="text" id="gpa" required></div>
        <div class="form-group"><label>تاریخ فارغ‌التحصیلی</label><input type="text" id="grad_date" required></div>
        <div class="form-group full"><label>مدرسه / دبیرستان</label><input type="text" id="school" required></div>
        <div class="form-group full"><label>مرجع صادرکننده</label><input type="text" id="issuer" value="اداره کل آموزش و پرورش" required></div>
        <div class="form-group full"><label>وضعیت گواهی</label><input type="text" id="status" value="تایید شده" required></div>
        
        <div class="form-group full">
          <label>عکس متقاضی</label>
          <div class="file-upload" onclick="document.getElementById('photoInput').click()">
              <input type="file" id="photoInput" accept="image/*" onchange="previewImage(event)">
              <span>برای انتخاب عکس کلیک کنید</span>
              <img id="imagePreview" alt="پیش‌نمایش">
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">ثبت و تولید لینک</button>
        <button type="button" class="btn-cancel" id="cancelEditBtn" onclick="cancelEdit()">لغو ویرایش</button>
      </form>

      <div id="resultBox" class="result-box">
        <h3>✅ عملیات با موفقیت انجام شد!</h3>
        <div class="link-container">
            <div class="link-text" id="finalLinkText"></div>
            <div class="action-buttons">
                <button class="btn-action-link btn-copy" onclick="copyLink()">📋 کپی لینک</button>
                <a class="btn-action-link btn-open" id="openLinkBtn" href="#" target="_blank">🌐 باز کردن لینک</a>
            </div>
        </div>
      </div>
    </div>

    <div id="tab-list" class="card">
      <h3 style="margin-bottom: 15px; color: #1e3a8a;">لیست متقاضیان ثبت شده</h3>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>کد رهگیری</th>
              <th>نام و نام خانوادگی</th>
              <th>کد ملی</th>
              <th>عملیات</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody">
            <tr><td colspan="4">در حال بارگذاری...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

<script>
  const WORKER_URL = "https://diplom-dita.asnadir361.workers.dev"; 
  const SITE_URL = "https://emt-medu-ir.github.io/ir/"; 
  let AUTH_TOKEN = "";
  
  // متغیرهای مربوط به عکس (برای جلوگیری از قاطی شدن)
  let newPhotoBase64 = ""; // عکس جدیدی که کاربر انتخاب می‌کند
  let existingPhotoBase64 = ""; // عکسی که از قبل در دیتابیس بوده

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
    
    if(tab === 'add') {
      document.getElementById('tabBtnAdd').classList.add('active');
      document.getElementById('tab-add').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-list').classList.add('active');
      loadRecords(); 
    }
  }

  // آپلود و پیش‌نمایش عکس جدید
  function previewImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 500 * 1024) { alert("حجم عکس نباید بیشتر از ۵۰۰ کیلوبایت باشد."); return; }
    
    const reader = new FileReader();
    reader.onload = function(e) {
        newPhotoBase64 = e.target.result; // ذخیره در متغیر عکس جدید
        const img = document.getElementById('imagePreview');
        img.src = newPhotoBase64;
        img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  async function login() {
    const pass = document.getElementById('adminPassword').value;
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.innerText = 'در حال بررسی...';
    try {
      const res = await fetch(`${WORKER_URL}/api/admin/login`, {
        method: 'POST', mode: 'cors', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
      });
      const data = await res.json();
      if (data.success) {
        AUTH_TOKEN = data.token; 
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('mainPanel').style.display = 'block';
      } else { document.getElementById('loginError').style.display = 'block'; }
    } catch (e) { alert("ارتباط با سرور برقرار نشد (فیلترشکن را روشن کنید)."); } 
    finally { btn.disabled = false; btn.innerText = 'ورود'; }
  }

  // ثبت یا ویرایش
  document.getElementById('adminForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; 
    const id = document.getElementById('edit_id').value;
    const isEdit = id !== "";
    btn.innerText = isEdit ? 'در حال ویرایش...' : 'در حال ثبت...';

    // منطق انتخاب عکس: اگر عکس جدیدی آپلود شده از آن استفاده کن، وگرنه عکس قبلی را نگه دار
    let finalPhoto = newPhotoBase64; 
    if (!finalPhoto && isEdit) {
        finalPhoto = existingPhotoBase64;
    }

    const data = {
      full_name: document.getElementById('full_name').value,
      father_name: document.getElementById('father_name').value,
      national_id: document.getElementById('national_id').value,
      birth_year: document.getElementById('birth_year').value,
      degree: document.getElementById('degree').value,
      major: document.getElementById('major').value,
      gpa: document.getElementById('gpa').value,
      grad_date: document.getElementById('grad_date').value,
      school: document.getElementById('school').value,
      issuer: document.getElementById('issuer').value,
      status: document.getElementById('status').value,
      photo_url: finalPhoto 
    };

    const url = isEdit ? `${WORKER_URL}/api/admin/edit/${id}` : `${WORKER_URL}/api/admin/add`;
    const method = isEdit ? 'PUT' : 'POST';

    try {
      const res = await fetch(url, {
        method: method, mode: 'cors',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AUTH_TOKEN },
        body: JSON.stringify(data)
      });
      const result = await res.json();

      if(result.success) {
        if(!isEdit) {
            // ساخت لینک و نمایش کادر نتیجه
            const finalUrl = SITE_URL + "?code=" + result.tracking_code;
            document.getElementById('finalLinkText').innerText = finalUrl;
            document.getElementById('openLinkBtn').href = finalUrl; // تنظیم دکمه باز کردن
            document.getElementById('resultBox').style.display = 'block';
        } else {
            alert("ویرایش با موفقیت انجام شد.");
            document.getElementById('resultBox').style.display = 'none';
            switchTab('list');
        }
        cancelEdit(); // ریست کردن فرم بعد از هر عملیات
      } else { alert("خطا: " + (result.error || "مشکل در عملیات")); }
    } catch(err) { alert("ارتباط با سرور برقرار نشد."); } 
    finally { 
        btn.disabled = false; 
        btn.innerText = isEdit ? 'ثبت تغییرات' : 'ثبت و تولید لینک'; 
    }
  });

  // تابع کپی کردن لینک
  function copyLink() {
      const text = document.getElementById('finalLinkText').innerText;
      navigator.clipboard.writeText(text).then(() => {
          alert("لینک با موفقیت کپی شد!");
      }).catch(err => {
          alert("خطا در کپی کردن لینک.");
      });
  }

  async function loadRecords() {
    const tbody = document.getElementById('recordsTableBody');
    tbody.innerHTML = '<tr><td colspan="4">در حال بارگذاری...</td></tr>';
    try {
      const res = await fetch(`${WORKER_URL}/api/admin/list`, {
        method: 'GET', headers: { 'Authorization': 'Bearer ' + AUTH_TOKEN }
      });
      const data = await res.json();
      
      if (data.success && data.records.length > 0) {
        tbody.innerHTML = '';
        data.records.forEach(r => {
          tbody.innerHTML += `
            <tr>
              <td>${r.tracking_code}</td>
              <td>${r.full_name}</td>
              <td>${r.national_id}</td>
              <td>
                <button class="btn-action btn-edit" onclick="editRecord(${r.id})">ویرایش</button>
                <button class="btn-action btn-delete" onclick="deleteRecord(${r.id})">حذف</button>
              </td>
            </tr>
          `;
        });
      } else if (data.success && data.records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">هیچ رکوردی یافت نشد.</td></tr>';
      } else { tbody.innerHTML = '<tr><td colspan="4">خطا در دریافت اطلاعات.</td></tr>'; }
    } catch(e) { tbody.innerHTML = '<tr><td colspan="4">خطا در ارتباط با سرور.</td></tr>'; }
  }

  async function editRecord(id) {
    try {
        const res = await fetch(`${WORKER_URL}/api/admin/get/${id}`, {
            method: 'GET', headers: { 'Authorization': 'Bearer ' + AUTH_TOKEN }
        });
        const data = await res.json();
        
        if(data.success) {
            const r = data.record;
            document.getElementById('edit_id').value = r.id;
            document.getElementById('full_name').value = r.full_name;
            document.getElementById('father_name').value = r.father_name;
            document.getElementById('national_id').value = r.national_id;
            document.getElementById('birth_year').value = r.birth_year;
            document.getElementById('degree').value = r.degree;
            document.getElementById('major').value = r.major;
            document.getElementById('gpa').value = r.gpa;
            document.getElementById('grad_date').value = r.grad_date;
            document.getElementById('school').value = r.school;
            document.getElementById('issuer').value = r.issuer;
            document.getElementById('status').value = r.status;
            
            // ریست کردن متغیرهای عکس برای جلوگیری از قاطی شدن
            newPhotoBase64 = ""; 
            existingPhotoBase64 = r.photo_url || "";
            
            const img = document.getElementById('imagePreview');
            if(r.photo_url) {
                img.src = r.photo_url;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }

            document.getElementById('formTitle').innerText = "ویرایش اطلاعات متقاضی";
            document.getElementById('submitBtn').innerText = "ثبت تغییرات";
            document.getElementById('submitBtn').style.background = "#f59e0b"; 
            document.getElementById('cancelEditBtn').style.display = 'block';
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tabBtnAdd').classList.add('active');
            document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
            document.getElementById('tab-add').classList.add('active');
            document.getElementById('resultBox').style.display = 'none';
        }
    } catch(e) { alert("خطا در دریافت اطلاعات."); }
  }

  function cancelEdit() {
      document.getElementById('adminForm').reset();
      document.getElementById('edit_id').value = "";
      document.getElementById('imagePreview').style.display = 'none';
      
      // ریست کردن کامل متغیرهای عکس
      newPhotoBase64 = "";
      existingPhotoBase64 = "";
      
      document.getElementById('formTitle').innerText = "ثبت متقاضی جدید";
      document.getElementById('submitBtn').innerText = "ثبت و تولید لینک";
      document.getElementById('submitBtn').style.background = "#10b981"; 
      document.getElementById('cancelEditBtn').style.display = 'none';
  }

  async function deleteRecord(id) {
    if(!confirm("آیا از حذف این متقاضی مطمئن هستید؟")) return;
    try {
      const res = await fetch(`${WORKER_URL}/api/admin/delete/${id}`, {
        method: 'DELETE', headers: { 'Authorization': 'Bearer ' + AUTH_TOKEN }
      });
      const data = await res.json();
      if(data.success) { loadRecords(); } 
      else { alert("خطا در حذف."); }
    } catch(e) { alert("ارتباط با سرور برقرار نشد."); }
  }
</script>
</body>
</html>
